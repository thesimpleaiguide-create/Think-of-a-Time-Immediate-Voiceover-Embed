<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think of a Time...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ttnNavy: '#0C2340',
                        ttnTrustBlue: '#005EB8',
                        ttnActionOrange: '#FE5000',
                        ttnSlate: '#333F48',
                        ttnIceBlue: '#DBE2E9'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .word-active {
            color: #005EB8;
            background-color: #DBE2E9;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 600;
            transition: all 120ms ease-out;
        }
    </style>
</head>
<body class="bg-transparent m-0 p-2 flex items-center justify-center min-h-[90px] font-sans antialiased w-full">

    <div class="w-full max-w-xl text-center space-y-1.5 cursor-pointer select-none" onclick="replayAudio()">
        
        <h1 class="text-2xl sm:text-3xl font-bold text-ttnNavy tracking-tight">
            Think of a Time...
        </h1>

        <p id="subheadingContainer" class="text-sm sm:text-base text-slate-600 font-normal leading-relaxed"></p>

        <div class="flex justify-center pt-1">
            <div class="w-12 h-1 bg-ttnTrustBlue rounded-full"></div>
        </div>

    </div>

    <audio id="syncAudio" preload="auto"></audio>

    <script>
        const audioFile = 'vo_think_of_a_time.wav';
        const subheadingText = "...you gave someone perfect advice, and they completely ignored it.";
        const words = subheadingText.split(' ');

        const subheadingEl = document.getElementById('subheadingContainer');
        const audio = document.getElementById('syncAudio');

        // Render words wrapped in span tags for synchronous highlighting
        subheadingEl.innerHTML = words.map((w, i) => `<span id="word-${i}" class="inline-block transition-colors">${w}</span>`).join(' ');

        let activeWordSpan = null;

        function clearHighlights() {
            if (activeWordSpan) {
                activeWordSpan.classList.remove('word-active');
                activeWordSpan = null;
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const progress = audio.currentTime / audio.duration;
            const wordIndex = Math.min(Math.floor(progress * words.length), words.length - 1);
            const targetSpan = document.getElementById(`word-${wordIndex}`);

            if (targetSpan && targetSpan !== activeWordSpan) {
                clearHighlights();
                targetSpan.classList.add('word-active');
                activeWordSpan = targetSpan;
            }
        });

        audio.addEventListener('ended', () => {
            clearHighlights();
        });

        function playAudio() {
            clearHighlights();
            audio.src = audioFile;
            audio.currentTime = 0;
            audio.volume = 1.0;
            audio.play().catch(err => {
                console.warn('Browser autoplay blocked:', err);
                // Fallback: start on first touch/click anywhere
                document.body.addEventListener('click', () => {
                    audio.play();
                }, { once: true });
            });
        }

        function replayAudio() {
            playAudio();
        }

        // Auto-play immediately on page load
        window.addEventListener('DOMContentLoaded', () => {
            playAudio();
        });
    </script>

</body>
</html>
