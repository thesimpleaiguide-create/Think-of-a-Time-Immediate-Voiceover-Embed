<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think of a Time...</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ttnNavy: '#0C2340',
                        ttnTrustBlue: '#005EB8',
                        ttnActionOrange: '#FE5000',
                        ttnSlate: '#333F48',
                        ttnIceBlue: '#DBE2E9'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        .word-active {
            color: #005EB8;
            background-color: #DBE2E9;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            transition: all 120ms ease-out;
        }
    </style>
</head>
<body class="bg-transparent m-0 p-4 sm:p-8 flex items-center justify-center min-h-[320px] w-full font-sans antialiased">

    <!-- Card Container referencing Watermark_Background.jpeg -->
    <div class="relative w-full max-w-4xl mx-auto rounded-2xl overflow-hidden shadow-sm border border-slate-200/80 bg-white flex flex-col items-center justify-center text-center py-10 sm:py-14 px-6 cursor-pointer select-none space-y-6" onclick="replayAudio()">
        
        <!-- Watermark Background Image Layer -->
        <div class="absolute inset-0 z-0 opacity-25 bg-cover bg-center pointer-events-none" style="background-image: url('Watermark_Background.jpeg');"></div>

        <!-- Content Area -->
        <div class="relative z-10 w-full flex flex-col items-center space-y-4">
            
            <!-- Large Prominent Heading -->
            <h1 class="text-3xl sm:text-5xl lg:text-6xl font-extrabold text-ttnNavy tracking-tight leading-tight">
                Think of a Time...
            </h1>

            <!-- Subheading with Synchronized Word Highlights -->
            <p id="subheadingContainer" class="text-lg sm:text-2xl lg:text-3xl text-slate-700 font-medium leading-relaxed max-w-3xl"></p>

            <!-- Centered Accent Bar -->
            <div class="pt-2">
                <div class="w-20 sm:w-28 h-1.5 sm:h-2 bg-ttnTrustBlue rounded-full shadow-sm"></div>
            </div>

        </div>

    </div>

    <!-- Hidden Audio Player referencing vo_think_of_a_time.wav -->
    <audio id="syncAudio" preload="auto"></audio>

    <script>
        const audioFile = 'vo_think_of_a_time.wav';
        const subheadingText = "...you gave someone perfect advice, and they completely ignored it.";
        const words = subheadingText.split(' ');

        const subheadingEl = document.getElementById('subheadingContainer');
        const audio = document.getElementById('syncAudio');

        // Render words wrapped in spans for dynamic highlighting
        subheadingEl.innerHTML = words.map((w, i) => `<span id="word-${i}" class="inline-block transition-colors">${w}</span>`).join(' ');

        let activeWordSpan = null;

        function clearHighlights() {
            if (activeWordSpan) {
                activeWordSpan.classList.remove('word-active');
                activeWordSpan = null;
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const progress = audio.currentTime / audio.duration;
            const wordIndex = Math.min(Math.floor(progress * words.length), words.length - 1);
            const targetSpan = document.getElementById(`word-${wordIndex}`);

            if (targetSpan && targetSpan !== activeWordSpan) {
                clearHighlights();
                targetSpan.classList.add('word-active');
                activeWordSpan = targetSpan;
            }
        });

        audio.addEventListener('ended', () => {
            clearHighlights();
        });

        function playAudio() {
            clearHighlights();
            audio.src = audioFile;
            audio.currentTime = 0;
            audio.volume = 1.0;
            audio.play().catch(err => {
                console.warn('Autoplay restricted by browser policy:', err);
                document.body.addEventListener('click', () => {
                    audio.play();
                }, { once: true });
            });
        }

        function replayAudio() {
            playAudio();
        }

        window.addEventListener('DOMContentLoaded', () => {
            playAudio();
        });
    </script>

</body>
</html>
